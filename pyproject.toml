[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "limitlens"
version = "1.2.0"
description = "Unified quota checker for AI coding tools (Codex, Amp, OpenCode, Antigravity, Cursor, Pi, Pioneer, AgentRouter, Command Code)"
readme = "README.md"
authors = [
    { name = "Salauddin", email = "salauddinn@users.noreply.github.com" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai", "quota", "codex", "amp", "antigravity", "cli", "developer-tools"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
mac = [
    "rumps>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/salauddinn/limitlens"
Repository = "https://github.com/salauddinn/limitlens"
Issues = "https://github.com/salauddinn/limitlens/issues"

[project.scripts]
limitlens = "limitlens.cli:main"
limitlens-menubar = "limitlens.menubar:main"

[tool.setuptools.packages.find]
include = ["limitlens*"]
exclude = ["tests*", "assets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
