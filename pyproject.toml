[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "limitlens"
version = "1.0.0"
description = "Unified quota checker for AI coding tools (Codex, Amp, OpenCode, Antigravity)"
readme = "README.md"
authors = [
    { name = "Salauddin", email = "nalbandsalauddin@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai", "quota", "codex", "amp", "antigravity", "cli", "developer-tools"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/salauddinn/limitlens"
Repository = "https://github.com/salauddinn/limitlens"
Issues = "https://github.com/salauddinn/limitlens/issues"

[project.scripts]
limitlens = "limitlens.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
