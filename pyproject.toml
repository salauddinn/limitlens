[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "limitlens"
version = "1.0.0"
description = "Unified quota checker for AI coding tools (Codex, Amp, OpenCode, Antigravity)"
readme = "README.md"
authors = [
    { name = "Salauddin", email = "nalbandsalauddin@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
limitlens = "limitlens.cli:main"
